name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.0.2

    # Build submodule
    - name: Setup build submodule
      run: mkdir lib/bin
    
    - name: Build submodule `oneTBB`
      run: |
        cmake lib/oneTBB
        cmake --build lib/oneTBB --target tbb --config Release
    
    - name: Build submodule `netcpp`
      run: |
        cmake lib/netcpp
        cmake --build lib/netcpp --target netcpp --config Release

    - name: Copy `.lib` & `.dll` to bin directory
      run: setup.bat

    - name: Build .sln project
      run: msbuild Engine.sln /p:Configuration=Release
